[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice-pipeline"
version = "0.4.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "httpx[socks]>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "markdown-it-py>=4.2,<5",
  "html-to-markdown>=3.10,<4",
]

[project.optional-dependencies]
web = [
  "curl_cffi>=0.16,<1",
  "trafilatura>=2,<3",
  "newspaper4k>=0.9,<1",
  "resiliparse>=0.16,<1",
]
ui = ["Flask>=3.0,<4"]
prefect = ["prefect>=3.0,<4"]
test = ["pytest>=8.0,<9"]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
  "ty>=0.0.1",
]

[project.scripts]
sluice = "sluice.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
