name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra web --extra ui --extra prefect
      - name: Lint (Ruff)
        run: .venv/bin/ruff check .
      # ty is intentionally deferred; integration tests are not excluded in v4.
      - name: Test
        run: .venv/bin/pytest -p no:cacheprovider -q tests
      - name: Compile
        run: .venv/bin/python -m compileall -q src tests examples
      - name: Check dependencies
        run: uv pip check
      - name: Build distributions
        run: uv build
